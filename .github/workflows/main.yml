name: Сборка и публикация микросервисов в GHCR

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [films, order]

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Авторизация в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Сборка и публикация образов микросервисов
        uses: docker/build-push-action@v6
        with:
          context: .
          # Динамически подставляем имя Docker-файла в зависимости от матричного шага
          file: ./Dockerfile.${{ matrix.service }}
          push: true
          # Образы в GHCR сохранятся как отдельные пакеты: имя-репозитория/films и имя-репозитория/order
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
