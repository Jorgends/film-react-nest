services:

  frontend:
    image: ghcr.io/jorgend/film-react-frontend:latest
    build:
      context: ./frontend
    restart: unless-stopped
    volumes:
      - frontend_dist:/shared

  backend:
    image: ghcr.io/jorgend/film-react-backend:latest
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
    volumes:
      - content_data:/app/public/content

  nginx:
    image: ghcr.io/jorgend/film-react-nginx:latest
    build:
      context: ./nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - frontend
      - backend
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  frontend_dist:
  postgres_data:
  pgadmin_data:
  content_data:
