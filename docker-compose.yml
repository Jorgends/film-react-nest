services:

  frontend:
    image: ghcr.io/jorgend/film-react-frontend:latest
    build:
      context: ./frontend
    volumes:
      - frontend_dist:/shared

  backend:
    image: ghcr.io/jorgend/film-react-backend:latest
    build:
      context: ./backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
    volumes:
      - content_data:/app/public/content

  nginx:
    image: ghcr.io/jorgend/film-react-nginx:latest
    build:
      context: ./nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: prac
      POSTGRES_USER: prac
      POSTGRES_PASSWORD: prac
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  frontend_dist:
  postgres_data:
  pgadmin_data:
  content_data:
